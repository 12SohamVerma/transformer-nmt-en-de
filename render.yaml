# Render Blueprint - deploys the Streamlit translation UI (app.py) as a free web service.
# In the Render dashboard: New + -> Blueprint -> select this repository.
services:
  - type: web
    name: transformer-nmt-en-de
    runtime: python
    plan: free
    buildCommand: >-
      pip install --upgrade pip &&
      pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements-render.txt
    startCommand: >-
      streamlit run app.py --server.port $PORT --server.address 0.0.0.0
      --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OMP_NUM_THREADS     # one CPU thread keeps memory low on the 512 MB free instance
        value: "1"
